[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "verticillium-detection"
version = "1.0.0"
description = "Detection and Optimization of a Neural Network for the Detection of Verticillium Disease in Olive Trees"
readme = "README.md"
requires-python = ">=3.9,<3.11"
license = {text = "MIT"}
authors = [
    {name = "Athanasios Nikolaou"}
]
keywords = [
    "deep-learning",
    "computer-vision",
    "verticillium-dahliae",
    "precision-agriculture",
    "drone-imagery",
    "optuna",
    "tensorflow"
]

[tool.black]
line-length = 100
target-version = ['py39', 'py310']

[tool.isort]
profile = "black"
line_length = 100

