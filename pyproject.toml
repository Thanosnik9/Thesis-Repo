[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "verticillium-detection"
version = "1.0.0"
description = "Detection and Optimization of a Neural Network for the Detection of Verticillium Disease in Olive Trees"
readme = "README.md"
requires-python = ">=3.9,<3.11"
license = {text = "MIT"}
authors = [
    {name = "Athanasios Nikolaou"}
]
keywords = [
    "deep-learning",
    "computer-vision",
    "verticillium-dahliae",
    "precision-agriculture",
    "drone-imagery",
    "optuna",
    "tensorflow"
]

[tool.black]
line-length = 100
target-version = ['py39', 'py310']

[tool.isort]
profile = "black"
line_length = 100

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "PLW", "C4"]
ignore = ["E501", "W293"]

[tool.ruff.lint.per-file-ignores]
"*.ipynb" = ["E501", "W293", "F811", "F401", "I001", "E402", "F402"]

